# Internal n8n instance (optional). NOTE: Render's free plan has no persistent disk,
# so workflows and credentials are lost on every restart. Use a paid plan with a disk
# before relying on this. Owner accounts are created in the n8n UI on first launch.
services:
  - type: web
    name: n8n
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      - key: WEBHOOK_URL
        sync: false # set to this service's public URL in the Render dashboard
      - key: N8N_DIAGNOSTICS_ENABLED
        value: "false"
